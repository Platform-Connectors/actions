name: Python CI
description: Runs linting, type checks, tests, and coverage with uv for a Python package.

inputs:
  python-version:
    description: Python version to use for the checks.
    required: false
    default: "3.11"
  package-source-folder:
    description: Package folder to lint/test coverage for (for example, src/gallagher_restapi).
    required: true
  run-ruff:
    description: Whether to run Ruff.
    required: false
    default: "true"
  run-mypy:
    description: Whether to run MyPy.
    required: false
    default: "true"
  run-pylint:
    description: Whether to run Pylint.
    required: false
    default: "true"
  run-pytest:
    description: Whether to run Pytest with coverage.
    required: false
    default: "true"
  total-coverage-threshold:
    description: "Minimum overall codebase coverage percentage enforced."
    required: false
    default: "95"
  diff-coverage-threshold:
    description: "Minimum PR changed-lines coverage percentage enforced by diff-cover."
    required: false
    default: "100"

outputs:
  coverage-report:
    description: Path to the generated coverage XML report.
    value: ${{ steps.coverage.outputs.coverage-report }}
  total-coverage:
    description: Total line coverage percentage from coverage.xml.
    value: ${{ steps.coverage.outputs.total-coverage }}
  diff-coverage:
    description: Changed-lines coverage percentage from diff-cover on pull requests.
    value: ${{ steps.diff_cover.outputs.diff-coverage }}

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        enable-cache: true

    - name: Install dependencies
      shell: bash
      run: uv sync --group dev

    - name: Ruff
      if: ${{ inputs.run-ruff == 'true' }}
      shell: bash
      run: uv run ruff check .

    - name: MyPy
      if: ${{ inputs.run-mypy == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        SOURCE_ROOT="$(dirname "${{ inputs.package-source-folder }}")"
        if [ -d tests ]; then
          uv run mypy "$SOURCE_ROOT" tests
        else
          uv run mypy "$SOURCE_ROOT"
        fi

    - name: Pylint
      if: ${{ inputs.run-pylint == 'true' }}
      shell: bash
      run: uv run pylint "${{ inputs.package-source-folder }}"

    - name: Pytest + coverage
      if: ${{ inputs.run-pytest == 'true' }}
      id: coverage
      shell: bash
      run: |
        set -euo pipefail
        uv run pytest -q --cov="${{ inputs.package-source-folder }}" --cov-report=xml --cov-report=term-missing
        TOTAL_COVERAGE=$(python -c "import xml.etree.ElementTree as ET; root=ET.parse('coverage.xml').getroot(); print(f'{float(root.attrib.get(\"line-rate\", \"0\"))*100:.2f}')")
        echo "coverage-report=coverage.xml" >> "$GITHUB_OUTPUT"
        echo "total-coverage=$TOTAL_COVERAGE" >> "$GITHUB_OUTPUT"
        echo "## Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
        echo "Total coverage: ${TOTAL_COVERAGE}%" >> "$GITHUB_STEP_SUMMARY"

    - name: Ensure base branch is available (PR only)
      if: github.event_name == 'pull_request'
      shell: bash
      run: git fetch origin "${{ github.base_ref }}"

    - name: Run Diff Coverage
      id: diff_coverage
      shell: bash
      run: |
        # 1. Run diff-cover
        uvx --from diff-cover diff-cover coverage.xml \
          --compare-branch=origin/${{ github.base_ref }} \
          --fail-under=${{ inputs.diff-coverage-threshold }} \
          --format markdown:diff-cover.md > terminal_output.log 2>&1

        EXIT_CODE=$?

        # 2. Check if there are actually any lines/files to compare in the diff
        if grep -qE "No lines with coverage|No Python files found" terminal_output.log; then
          HAS_CHANGES="false"
          DIFF_PERCENTAGE="0%"
          EXIT_CODE=0
        else
          HAS_CHANGES="true"
          DIFF_PERCENTAGE=$(grep -i "Coverage:" terminal_output.log | grep -oE "[0-9]+%" | head -1 || echo "0%")
          if [ -z "$DIFF_PERCENTAGE" ]; then
            DIFF_PERCENTAGE=$(grep -oE "[0-9]+(\.[0-9]+)?%" terminal_output.log | tail -1 || echo "0%")
          fi
        fi

        # 3. Extract the TOTAL repository coverage from the log
        TOTAL_PERCENTAGE=$(grep -i "TOTAL" terminal_output.log | grep -oE "[0-9]+%" | head -1 || echo "0%")
        TOTAL_NUM=$(echo "$TOTAL_PERCENTAGE" | sed 's/%//')
        TARGET_TOTAL="${{ inputs.total-coverage-threshold }}"

        # Determine total coverage state
        if [ "$TOTAL_NUM" -ge "$TARGET_TOTAL" ]; then
          TOTAL_STATUS="success"
        else
          TOTAL_STATUS="failure"
        fi

        # Export outputs
        echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT
        echo "diff_percentage=$DIFF_PERCENTAGE" >> $GITHUB_OUTPUT
        echo "diff_exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
        echo "total_percentage=$TOTAL_PERCENTAGE" >> $GITHUB_OUTPUT
        echo "total_status=$TOTAL_STATUS" >> $GITHUB_OUTPUT

        # 4. Push markdown summary page for deep diving logs
        if [ "$HAS_CHANGES" = "true" ] && [ -f diff-cover.md ]; then
          cat diff-cover.md >> $GITHUB_STEP_SUMMARY
        else
          echo "### ℹ️ Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Total Project Coverage:** $TOTAL_PERCENTAGE (Target: ${TARGET_TOTAL}%)" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Post Status Check to PR (Only on Failures)
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
        HAS_CHANGES: ${{ steps.diff_coverage.outputs.has_changes }}
        DIFF_PERCENTAGE: ${{ steps.diff_coverage.outputs.diff_percentage }}
        DIFF_EXIT_CODE: ${{ steps.diff_coverage.outputs.diff_exit_code }}
        DIFF_TARGET: ${{ inputs.diff-coverage-threshold }}
        TOTAL_PERCENTAGE: ${{ steps.diff_coverage.outputs.total_percentage }}
        TOTAL_STATUS: ${{ steps.diff_coverage.outputs.total_status }}
        TOTAL_TARGET: ${{ inputs.total-coverage-threshold }}
        TARGET_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      shell: bash
      run: |
        SHOULD_FAIL_JOB=false

        # --- POST TOTAL PROJECT COVERAGE ONLY IF FAILED ---
        if [ "$TOTAL_STATUS" = "failure" ]; then
          TOTAL_DESC="TOTAL coverage fell short: $TOTAL_PERCENTAGE (Target ${TOTAL_TARGET}%)"
          
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
            -f state="failure" \
            -f context="diff-cover/project" \
            -f description="$TOTAL_DESC" \
            -f target_url="$TARGET_URL"
            
          SHOULD_FAIL_JOB=true
        fi

        # --- POST PATCH/DIFF COVERAGE ONLY IF FAILED ---
        if [ "$HAS_CHANGES" = "true" ] && [ "$DIFF_EXIT_CODE" -ne 0 ]; then
          DIFF_DESC="PATCH coverage fell short: $DIFF_PERCENTAGE (Target ${DIFF_TARGET}%)"
          
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
            -f state="failure" \
            -f context="diff-cover/patch" \
            -f description="$DIFF_DESC" \
            -f target_url="$TARGET_URL"

          SHOULD_FAIL_JOB=true
        fi

        # --- CONCLUDE RUN WITH TRUTHFUL EXIT CODE ---
        if [ "$SHOULD_FAIL_JOB" = true ]; then
          exit 1
        fi
