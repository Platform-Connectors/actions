name: Python CI
description: Runs linting, type checks, tests, and coverage with uv for a Python package.

inputs:
  python-version:
    description: Python version to use for the checks.
    required: false
    default: "3.11"
  package-source-folder:
    description: Package folder to lint/test coverage for (for example, src/gallagher_restapi).
    required: true
  run-ruff:
    description: Whether to run Ruff.
    required: false
    default: "true"
  run-mypy:
    description: Whether to run MyPy.
    required: false
    default: "true"
  run-pylint:
    description: Whether to run Pylint.
    required: false
    default: "true"
  run-pytest:
    description: Whether to run Pytest with coverage.
    required: false
    default: "true"
  total-coverage-threshold:
    description: "Minimum overall codebase coverage percentage enforced."
    required: false
    default: "95"
  diff-coverage-threshold:
    description: "Minimum PR changed-lines coverage percentage enforced by diff-cover."
    required: false
    default: "100"

outputs:
  coverage-report:
    description: Path to the generated coverage XML report.
    value: ${{ steps.coverage.outputs.coverage-report }}
  total-coverage:
    description: Total line coverage percentage from coverage.xml.
    value: ${{ steps.coverage.outputs.total-coverage }}
  diff-coverage:
    description: Changed-lines coverage percentage from diff-cover on pull requests.
    value: ${{ steps.diff_cover.outputs.diff-coverage }}

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        enable-cache: true

    - name: Install dependencies
      shell: bash
      run: uv sync --group dev

    - name: Ruff
      if: ${{ inputs.run-ruff == 'true' }}
      shell: bash
      run: uv run ruff check .

    - name: MyPy
      if: ${{ inputs.run-mypy == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        SOURCE_ROOT="$(dirname "${{ inputs.package-source-folder }}")"
        if [ -d tests ]; then
          uv run mypy "$SOURCE_ROOT" tests
        else
          uv run mypy "$SOURCE_ROOT"
        fi

    - name: Pylint
      if: ${{ inputs.run-pylint == 'true' }}
      shell: bash
      run: uv run pylint "${{ inputs.package-source-folder }}"

    - name: Pytest + coverage
      if: ${{ inputs.run-pytest == 'true' }}
      id: coverage
      shell: bash
      run: |
        set -euo pipefail
        uv run pytest -q --cov="${{ inputs.package-source-folder }}" --cov-report=xml --cov-report=term-missing
        TOTAL_COVERAGE=$(python -c "import xml.etree.ElementTree as ET; root=ET.parse('coverage.xml').getroot(); print(f'{float(root.attrib.get(\"line-rate\", \"0\"))*100:.2f}')")
        echo "coverage-report=coverage.xml" >> "$GITHUB_OUTPUT"
        echo "total-coverage=$TOTAL_COVERAGE" >> "$GITHUB_OUTPUT"
        echo "## Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
        echo "Total coverage: ${TOTAL_COVERAGE}%" >> "$GITHUB_STEP_SUMMARY"

    - name: Ensure base branch is available (PR only)
      if: github.event_name == 'pull_request'
      shell: bash
      run: git fetch origin "${{ github.base_ref }}"

    - name: Run Diff Coverage
      id: diff_coverage
      shell: bash
      run: |
        # 1. Run diff-cover (Remove the heavy stdout redirection so we can grab the percentage)
        uvx --from diff-cover diff-cover coverage.xml \
          --compare-branch=origin/${{ github.base_ref }} \
          --fail-under=${{ inputs.diff-coverage-threshold }} \
          --format markdown:diff-cover.md > terminal_output.log 2>&1

        # Save the exit code to determine success/failure later
        EXIT_CODE=$?

        # 2. Extract the overall percentage from the terminal output
        # diff-cover outputs a line like: "Total: 12 lines, 10 covered (83%)" or similar.
        # Let's grab the percentage line cleanly:
        PERCENTAGE=$(grep -i "Coverage:" terminal_output.log | grep -oE "[0-9]+%" | head -1 || echo "0%")
        if [ -z "$PERCENTAGE" ]; then
          PERCENTAGE=$(grep -oE "[0-9]+(\.[0-9]+)?%" terminal_output.log | tail -1 || echo "0%")
        fi

        echo "percentage=$PERCENTAGE" >> $GITHUB_OUTPUT
        echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

        # 3. Push the markdown report directly to the GitHub Actions Summary page
        if [ -f diff-cover.md ]; then
          cat diff-cover.md >> $GITHUB_STEP_SUMMARY
        else
          echo "### ❌ Diff Cover failed to generate a report" >> $GITHUB_STEP_SUMMARY
          cat terminal_output.log >> $GITHUB_STEP_SUMMARY
        fi

    # 4. Post the custom status check directly to the PR merge box
    - name: Post Status Check to PR
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
        PERCENTAGE: ${{ steps.diff_coverage.outputs.percentage }}
        EXIT_CODE: ${{ steps.diff_coverage.outputs.exit_code }}
        TARGET: ${{ inputs.diff-coverage-threshold }}
      shell: bash
      run: |
        # Determine state and description
        if [ "$EXIT_CODE" -eq 0 ]; then
          STATE="success"
          DESC="$PERCENTAGE of diff hit (target $TARGET%)"
        else
          STATE="failure"
          DESC="$PERCENTAGE of diff hit (target $TARGET%)"
        fi

        # Call GitHub API to create the exact status line
        gh api \
          --method POST \
          -H "Accept: application/vnd.github+json" \
          /repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
          -f state="$STATE" \
          -f context="diff-cover/patch" \
          -f description="$DESC" \
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

        # Finally, force the workflow runner to actually fail if diff-cover failed
        if [ "$EXIT_CODE" -ne 0 ]; then
          exit 1
        fi
