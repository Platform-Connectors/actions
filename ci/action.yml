name: Python CI
description: Runs linting, type checks, tests, and coverage with uv for a Python package.

inputs:
  python-version:
    description: Python version to use for the checks.
    required: false
    default: "3.11"
  package-source-folder:
    description: Package folder to lint/test coverage for (for example, src/gallagher_restapi).
    required: true
  run-ruff:
    description: Whether to run Ruff.
    required: false
    default: "true"
  run-mypy:
    description: Whether to run MyPy.
    required: false
    default: "true"
  run-pylint:
    description: Whether to run Pylint.
    required: false
    default: "true"
  run-pytest:
    description: Whether to run Pytest with coverage.
    required: false
    default: "true"
  total-coverage-threshold:
    description: "Minimum overall codebase coverage percentage enforced."
    required: false
    default: "95"
  diff-coverage-threshold:
    description: "Minimum PR changed-lines coverage percentage enforced by diff-cover."
    required: false
    default: "100"

outputs:
  coverage-report:
    description: Path to the generated coverage XML report.
    value: ${{ steps.coverage.outputs.coverage-report }}
  total-coverage:
    description: Total line coverage percentage from coverage.xml.
    value: ${{ steps.coverage.outputs.total-coverage }}
  diff-coverage:
    description: Changed-lines coverage percentage from diff-cover on pull requests.
    value: ${{ steps.diff_cover.outputs.diff-coverage }}

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        enable-cache: true

    - name: Install dependencies
      shell: bash
      run: uv sync --group dev

    - name: Ruff
      if: ${{ inputs.run-ruff == 'true' }}
      shell: bash
      run: uv run ruff check .

    - name: MyPy
      if: ${{ inputs.run-mypy == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        SOURCE_ROOT="$(dirname "${{ inputs.package-source-folder }}")"
        if [ -d tests ]; then
          uv run mypy "$SOURCE_ROOT" tests
        else
          uv run mypy "$SOURCE_ROOT"
        fi

    - name: Pylint
      if: ${{ inputs.run-pylint == 'true' }}
      shell: bash
      run: uv run pylint "${{ inputs.package-source-folder }}"

    - name: Pytest + coverage
      if: ${{ inputs.run-pytest == 'true' }}
      id: coverage
      shell: bash
      run: |
        set -euo pipefail
        uv run pytest -q --cov="${{ inputs.package-source-folder }}" --cov-report=xml --cov-report=term-missing
        TOTAL_COVERAGE=$(python -c "import xml.etree.ElementTree as ET; root=ET.parse('coverage.xml').getroot(); print(f'{float(root.attrib.get(\"line-rate\", \"0\"))*100:.2f}')")
        echo "coverage-report=coverage.xml" >> "$GITHUB_OUTPUT"
        echo "total-coverage=$TOTAL_COVERAGE" >> "$GITHUB_OUTPUT"
        echo "## Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
        echo "Total coverage: ${TOTAL_COVERAGE}%" >> "$GITHUB_STEP_SUMMARY"

    - name: Ensure base branch is available (PR only)
      if: github.event_name == 'pull_request'
      shell: bash
      run: git fetch origin "${{ github.base_ref }}"

    - name: Run Diff Coverage Extraction
      id: diff_coverage
      shell: bash
      run: |
        uvx --from diff-cover diff-cover coverage.xml \
          --compare-branch=origin/${{ github.base_ref }} \
          --fail-under=${{ inputs.diff-coverage-threshold }} \
          --format markdown:diff-cover.md \
          --format json:diff-cover.json

        DIFF_EXIT_CODE=$?

        if [ -f diff-cover.json ]; then
          HAS_CHANGES=$(python3 -c "import json; data=json.load(open('diff-cover.json')); print('false' if data.get('total_lines', 0) == 0 else 'true')")
          DIFF_COVERAGE=$(python3 -c "import json; data=json.load(open('diff-cover.json')); print(f'{float(data.get(\"total_percentage\", 0)):.2f}')")
        else
          HAS_CHANGES="false"
          DIFF_COVERAGE="0.00"
        fi

        echo "has-changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
        echo "diff-coverage=$DIFF_COVERAGE" >> "$GITHUB_OUTPUT"
        echo "diff-exit-code=$DIFF_EXIT_CODE" >> "$GITHUB_OUTPUT"

        if [ "$HAS_CHANGES" = "true" ] && [ -f diff-cover.md ]; then
          cat diff-cover.md >> $GITHUB_STEP_SUMMARY
        else
          echo "### ℹ️ Patch Summary" >> $GITHUB_STEP_SUMMARY
          echo "No source code line modifications detected inside this PR diff." >> $GITHUB_STEP_SUMMARY
        fi
    - name: Post Status Check to PR
      if: success()
      env:
        GH_TOKEN: ${{ github.token }}
        TOTAL_COVERAGE: ${{ steps.coverage.outputs.total-coverage }}
        TOTAL_TARGET: ${{ inputs.total-coverage-threshold }}
        HAS_CHANGES: ${{ steps.diff_coverage.outputs.has-changes }}
        DIFF_COVERAGE: ${{ steps.diff_coverage.outputs.diff-coverage }}
        DIFF_EXIT_CODE: ${{ steps.diff_coverage.outputs.diff-exit-code }}
        DIFF_TARGET: ${{ inputs.diff-coverage-threshold }}
        TARGET_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      shell: bash
      run: |
        SHOULD_FAIL_JOB=false

        # 1. Check Total Codebase Coverage Threshold
        TOTAL_PASSED=$(python3 -c "print('true' if float('$TOTAL_COVERAGE') >= float('$TOTAL_TARGET') else 'false')")

        if [ "$TOTAL_PASSED" = "false" ]; then
          TOTAL_DESC="TOTAL coverage fell short: ${TOTAL_COVERAGE}% (Target ${TOTAL_TARGET}%)"
          echo "❌ $TOTAL_DESC"
          
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
            -f state="failure" \
            -f context="coverage/project" \
            -f description="$TOTAL_DESC" \
            -f target_url="$TARGET_URL"
            
          SHOULD_FAIL_JOB=true
        fi

        # 2. Check Patch/Diff Coverage Threshold (Only if code actually changed)
        if [ "$HAS_CHANGES" = "true" ]; then
          DIFF_PASSED=$(python3 -c "print('true' if float('$DIFF_COVERAGE') >= float('$DIFF_TARGET') else 'false')")
          
          if [ "$DIFF_PASSED" = "false" ] || [ "$DIFF_EXIT_CODE" -ne 0 ]; then
            DIFF_DESC="PATCH coverage fell short: ${DIFF_COVERAGE}% (Target ${DIFF_TARGET}%)"
            echo "❌ $DIFF_DESC"
            
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
              -f state="failure" \
              -f context="coverage/changes" \
              -f description="$DIFF_DESC" \
              -f target_url="$TARGET_URL"

            SHOULD_FAIL_JOB=true
          fi
        fi

        # 3. Final Termination Handler
        if [ "$SHOULD_FAIL_JOB" = "true" ]; then
          exit 1
        fi

        echo "✅ All coverage matrices passed safely. Passing silently."
